<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    body {
      background: #d4f8cb;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
      margin: 0;
    }

    .login-box {
      background: #0a802a;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      color: white;

      width: 100%;
      max-width: 350px;
      box-shadow: 0 4px 12px #00000030;
    }

    .login-box h2 {
      margin-bottom: 20px;
      font-size: 26px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: none;
      border-radius: 6px;
      background: #ffffff20;
      color: #fff8e6;
      transition: 0.3s;
      font-size: 16px;
    }

    .login-box input:focus {
      outline: 2px solid #a4ff9f;
      background: #ffffff30;
    }

    .login-box button {
      width: 100%;
      background-color: #fff8e6;
      color: green;
      padding: 12px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      border: none;
      margin-top: 15px;
      transition: 0.3s;
      font-size: 16px;
    }

    .login-box button:hover {
      background-color: #e6f7dd;
    }

    .login-box a {
      color: #fff8e6;
      font-size: 13px;
      display: block;
      margin-top: 10px;
      text-decoration: none;
    }

    .signup {
      margin-top: 20px;
      font-size: 14px;
    }

    .signup a {
      background-color: #fff8e6;
      color: green;
      padding: 8px 20px;
      font-weight: bold;
      border-radius: 20px;
      text-decoration: none;
      border: none;
      transition: 0.3s;
      display: inline-block;
      margin-top: 10px;
    }

    .signup a:hover {
      background-color: #e3f7d3;
    }

    /* Responsive adjustments for very small phones */
    @media (max-width: 350px) {
      .login-box {
        padding: 25px;
      }
      .login-box h2 {
        font-size: 22px;
      }
      .login-box input,
      .login-box button {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="login-box">

    <h2>Login</h2>

    <form method="post">
      {% csrf_token %}

      {{ form.username.label }}<br>
      {{ form.username }}<br>

      {{ form.password.label }}<br>
      {{ form.password }}<br>


      <button type="submit">Login</button>
    </form>

    <div class="signup">
      Don’t have an account?
      <br>
      <a href="{% url 'register' %}">Sign up</a>
    </div>

  </div>
</body>
</html>
